name: Release

# Builds wreckfest_telemetry.asi (cross-compiled via MinGW-w64, same
# toolchain path as the Docker/local Linux build documented in the
# README) and publishes it as a GitHub Release, so users can download a
# working binary without building it themselves.
#
# Trigger: push a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake mingw-w64

      - name: Run host-side tests
        run: |
          cmake -B build-host .
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Cross-compile the plugin
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify output
        run: |
          file build/wreckfest_telemetry.asi | grep "PE32+ executable"
          # Confirm no dependency beyond standard Windows system DLLs --
          # anything else means the static-link flags didn't take, and the
          # game's install dir won't have the missing DLL.
          DEPS="$(x86_64-w64-mingw32-objdump -p build/wreckfest_telemetry.asi | grep 'DLL Name' | awk '{print $3}')"
          echo "$DEPS"
          echo "$DEPS" | grep -viqE '^(ADVAPI32\.dll|KERNEL32\.dll|msvcrt\.dll|WINHTTP\.dll)$' && \
            { echo "unexpected DLL dependency"; exit 1; } || true

      - name: Package
        run: |
          mkdir -p dist
          cp build/wreckfest_telemetry.asi dist/
          cp config.json.example dist/
          cd dist && zip -r "../wreckfest-telemetry-asi-${GITHUB_REF_NAME}.zip" .

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wreckfest-telemetry-asi-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            See the [README](https://github.com/${{ github.repository }}#installing) for install
            steps: drop `wreckfest_telemetry.asi` into your Wreckfest install's `scripts/` folder
            alongside [Ultimate ASI Loader](https://github.com/ThirteenAG/Ultimate-ASI-Loader)
            (renamed `version.dll`), copy `config.json.example` to `config.json` if you want races
            posted automatically, and add the `WINEDLLOVERRIDES` launch option if you're on Steam
            Play (Proton).

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: wreckfest-telemetry-asi
          path: dist/
