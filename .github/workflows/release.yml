name: Release

# Builds wreckfest_telemetry.asi (cross-compiled via MinGW-w64, same
# toolchain path as the Docker/local Linux build documented in the
# README) and publishes it as a GitHub Release, so users can download a
# working binary without building it themselves.
#
# Trigger: push a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: |
          # Tag pushes (the release path) get the tag itself, e.g. v0.1.0.
          # A manual workflow_dispatch run isn't on a tag -- github.ref_name
          # would just be the branch name there, so fall back to a "dev-"
          # + short SHA build identifier instead.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake mingw-w64

      - name: Run host-side tests
        run: |
          cmake -B build-host .
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Cross-compile the plugin
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify output
        run: |
          file build/wreckfest_telemetry.asi | grep "PE32+ executable"
          # Confirm no dependency beyond standard Windows system DLLs --
          # anything else means the static-link flags didn't take, and the
          # game's install dir won't have the missing DLL.
          DEPS="$(x86_64-w64-mingw32-objdump -p build/wreckfest_telemetry.asi | grep 'DLL Name' | awk '{print $3}')"
          echo "$DEPS"
          echo "$DEPS" | grep -viqE '^(ADVAPI32\.dll|KERNEL32\.dll|msvcrt\.dll|WINHTTP\.dll)$' && \
            { echo "unexpected DLL dependency"; exit 1; } || true

      - name: Package
        run: |
          mkdir -p dist/scripts

          # Ultimate ASI Loader -- ships as version.dll at the Wreckfest
          # install root; renamed by convention so the game loads it in
          # place of the real system DLL, which it then proxies through.
          curl -sL -o ual.zip https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/x64-latest/version-x64.zip
          unzip -p ual.zip version.dll > dist/version.dll

          # Version goes in the .asi filename itself, not just the zip --
          # once extracted into the game's install root, the zip name is
          # gone, and this is the only way someone can tell what version
          # they have installed later.
          cp build/wreckfest_telemetry.asi "dist/scripts/wreckfest_telemetry-${VERSION}.asi"
          echo "your-per-user-api-key-from-settings-page" > dist/scripts/api-key.txt

          cd dist && zip -r "../wreckfest-telemetry-asi-${VERSION}.zip" .

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wreckfest-telemetry-asi-${{ env.VERSION }}.zip
          generate_release_notes: true
          body: |
            See the [README](https://github.com/${{ github.repository }}#installing) for install
            steps: extract this zip into your Wreckfest install root -- it bundles
            [Ultimate ASI Loader](https://github.com/ThirteenAG/Ultimate-ASI-Loader) (`version.dll`)
            and a `scripts/` folder with `wreckfest_telemetry-${{ env.VERSION }}.asi` and
            `api-key.txt` -- then put your API key from the
            [settings page](https://wfracelog.com/#/settings/api-keys) into `scripts/api-key.txt`,
            and add the `WINEDLLOVERRIDES` launch option if you're on Steam Play (Proton).

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: wreckfest-telemetry-asi
          path: dist/
