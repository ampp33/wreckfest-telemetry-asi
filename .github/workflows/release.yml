name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "New version tag to create and release (e.g. v0.1.0) -- must not already exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::'${VERSION}' isn't a version tag -- expected vX.Y or vX.Y.Z (e.g. v0.1.0)"
            exit 1
          fi

      - name: Check tag doesn't already exist
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            echo "::error::Tag '${VERSION}' already exists -- pick a new version, or delete the existing tag first if you really mean to re-release it"
            exit 1
          fi

      # Host-side tests build natively with the runner's preinstalled
      # cmake/gcc -- the Docker image only carries the cross toolchain.
      - name: Run host-side tests
        run: |
          cmake -B build-host .
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Build
        run: |
          docker build -t wreckfest-telemetry-asi-builder .
          docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd):/src" wreckfest-telemetry-asi-builder

      - name: Verify output
        run: |
          file build/wreckfest_telemetry.asi | grep "PE32+ executable"
          # Confirm no dependency beyond standard Windows system DLLs --
          # anything else means the static-link flags didn't take, and the
          # game's install dir won't have the missing DLL.
          DEPS="$(docker run --rm -v "$(pwd)/build:/build" --entrypoint x86_64-w64-mingw32-objdump \
            wreckfest-telemetry-asi-builder -p /build/wreckfest_telemetry.asi | grep 'DLL Name' | awk '{print $3}')"
          echo "$DEPS"
          echo "$DEPS" | grep -viqE '^(ADVAPI32\.dll|KERNEL32\.dll|msvcrt\.dll|WINHTTP\.dll)$' && \
            { echo "unexpected DLL dependency"; exit 1; } || true

      - name: Package
        run: |
          mkdir -p dist/scripts

          # Ultimate ASI Loader -- ships as version.dll at the Wreckfest
          # install root; renamed by convention so the game loads it in
          # place of the real system DLL, which it then proxies through.
          curl -sL -o ual.zip https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/x64-latest/version-x64.zip
          unzip -p ual.zip version.dll > dist/version.dll

          # Version goes in the .asi filename itself, not just the zip --
          # once extracted into the game's install root, so that users can
          # tell which version of the plugin they have installed
          cp build/wreckfest_telemetry.asi "dist/scripts/wreckfest_telemetry-${VERSION}.asi"
          echo "your-per-user-api-key-from-settings-page" > dist/scripts/api-key.txt

          cd dist && zip -r "../wreckfest-telemetry-asi-${VERSION}.zip" .

      # Only tagged after the build passes, so a failed run doesn't leave
      # a tag behind. A tag pushed with GITHUB_TOKEN doesn't trigger this
      # workflow again, so there's no duplicate tag-push run.
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/${VERSION}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: wreckfest-telemetry-asi-${{ env.VERSION }}.zip
          generate_release_notes: true
          body: |
            See the [README](https://github.com/${{ github.repository }}#installing) for installation steps.
